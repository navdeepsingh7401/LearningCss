<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get notified when Ping launches. Subscribe for updates."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Ping | Coming Soon</title>
  </head>
  <body>
    <main class="announcement">
      <img class="logo" src="./images/logo.svg" alt="Ping" />

      <h1>We are launching <strong>soon!</strong></h1>
      <p class="subtitle">Subscribe and get notified</p>

      <form class="subscribe-form">
        <label class="visually-hidden" for="email">Your email address</label>
        <div class="email-field">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Your email address..."
            autocomplete="email"
            aria-describedby="email-feedback"
            required
          />
          <p
            class="form-feedback"
            id="email-feedback"
            aria-live="polite"
            hidden
          ></p>
        </div>
        <button type="submit">Notify Me</button>
      </form>

      <img
        class="dashboard"
        src="./images/illustration-dashboard.png"
        alt="Preview of the Ping analytics dashboard"
      />
    </main>

    <footer class="site-footer">
      <nav class="social-links" aria-label="Social media">
        <a href="https://www.facebook.com/" aria-label="Facebook">
          <img
            src="./images/facebook-f-brands-solid-full.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
        <a href="https://www.twitter.com/" aria-label="Twitter">
          <img
            src="./images/square-twitter-brands-solid-full.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
        <a href="https://www.instagram.com/" aria-label="Instagram">
          <img
            src="./images/instagram-brands-solid-full.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
      </nav>
      <p class="copyright">&copy; Copyright Ping. All rights reserved.</p>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
