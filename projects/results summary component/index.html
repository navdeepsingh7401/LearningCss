<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Results summary component</title>
  </head>
  <body>
    <main class="card" aria-label="Results summary component">
      <section class="result-panel" aria-labelledby="result-heading">
        <h1 id="result-heading">Your Result</h1>

        <div class="score-ring" aria-label="Total score">
          <div class="score-inner">
            <span class="score-value" id="score-total">76</span>
            <span class="score-total">of 100</span>
          </div>
        </div>

        <h2>Great</h2>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </section>

      <section class="summary-panel" aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <div id="summary-list" class="summary-list" aria-live="polite"></div>
        <button type="button">Continue</button>
      </section>
    </main>

    <script>
      const results = [
        { category: 'Reaction', score: 80, icon: './assets/images/icon-reaction.svg' },
        { category: 'Memory', score: 92, icon: './assets/images/icon-memory.svg' },
        { category: 'Verbal', score: 61, icon: './assets/images/icon-verbal.svg' },
        { category: 'Visual', score: 72, icon: './assets/images/icon-visual.svg' }
      ];

      const scoreOutput = document.getElementById('score-total');
      const summaryList = document.getElementById('summary-list');

      const total = Math.round(results.reduce((sum, item) => sum + item.score, 0) / results.length);
      scoreOutput.textContent = total;

      const categoryClasses = {
        Reaction: 'reaction',
        Memory: 'memory',
        Verbal: 'verbal',
        Visual: 'visual'
      };

      summaryList.innerHTML = results
        .map(({ category, score, icon }) => {
          const itemClass = categoryClasses[category] || 'default';
          return `
            <div class="summary-item ${itemClass}">
              <div class="summary-label">
                <img src="${icon}" alt="" aria-hidden="true" />
                <span>${category}</span>
              </div>
              <div class="summary-score">
                <span class="value">${score}</span>
                <span class="divider">/</span>
                <span class="max">100</span>
              </div>
            </div>
          `;
        })
        .join('');
    </script>
  </body>
</html>
